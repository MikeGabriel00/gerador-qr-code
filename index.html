<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de QR Code</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f5; display: flex; justify-content: center;
      align-items: center; min-height: 100vh; margin: 0; padding: 16px;
    }
    .container {
      background: white; padding: 24px; border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08); width: 100%; max-width: 460px;
    }
    h1 { font-size: 1.4rem; color: #1f2937; text-align: center; margin-top: 0; }
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
    .tab-btn {
      flex: 1; padding: 10px 6px; background: #e5e7eb; color: #374151;
      border: 0; border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    .tab-btn.active { background: #2563eb; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    input, select {
      width: 100%; padding: 10px; margin-bottom: 10px;
      border: 1px solid #d1d5db; border-radius: 8px; font-size: .95rem;
    }
    .options-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin: 8px 0 12px; font-size: .85rem; color: #4b5563;
    }
    .options-grid label { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    input[type="color"] { padding: 2px; height: 38px; cursor: pointer; }
    input[type="file"] { padding: 6px; font-size: .8rem; }
    .btn-clear {
      background: #ef4444; color: white; border: 0; border-radius: 6px;
      padding: 6px 8px; font-size: .75rem; cursor: pointer; display: none;
    }
    .btn-main, .btn-download {
      width: 100%; padding: 12px; color: white; border: 0; border-radius: 8px;
      font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 5px;
    }
    .btn-main { background: #2563eb; }
    .btn-download { background: #16a34a; display: none; margin-top: 8px; }
    #resultado { display: flex; justify-content: center; margin: 20px 0; }
    #qr-canvas {
      max-width: 100%; height: auto; border-radius: 8px;
      border: 1px solid #e5e7eb; display: none;
    }
    #mensagem { color: #b91c1c; font-size: .9rem; margin-top: 10px; }
    .observacao { color: #6b7280; font-size: .8rem; line-height: 1.4; }
  </style>
  <!-- Biblioteca QRCode.js: requer internet se o arquivo não for salvo localmente. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="container">
  <h1>Gerador de QR Code</h1>

  <div class="tabs">
    <button type="button" class="tab-btn active" data-aba="texto">Link / Texto</button>
    <button type="button" class="tab-btn" data-aba="wifi">Wi-Fi</button>
    <button type="button" class="tab-btn" data-aba="whats">WhatsApp</button>
  </div>

  <div id="aba-texto" class="tab-content active">
    <input type="text" id="input-texto" placeholder="Cole um link, texto ou código Pix" autocomplete="off">
  </div>

  <div id="aba-wifi" class="tab-content">
    <input type="text" id="wifi-ssid" placeholder="Nome da rede Wi-Fi (SSID)" autocomplete="off">
    <input type="password" id="wifi-senha" placeholder="Senha do Wi-Fi" autocomplete="off">
    <select id="wifi-tipo">
      <option value="WPA">Segurança: WPA/WPA2 (padrão)</option>
      <option value="WEP">Segurança: WEP</option>
      <option value="nopass">Sem senha</option>
    </select>
  </div>

  <div id="aba-whats" class="tab-content">
    <input type="tel" id="whats-num" placeholder="Número com país e DDD (ex.: 5511999999999)" autocomplete="tel">
    <input type="text" id="whats-msg" placeholder="Mensagem automática (opcional)" autocomplete="off">
  </div>

  <div class="options-grid">
    <label>Cor do código
      <input type="color" id="corFrente" value="#000000">
    </label>
    <label>Cor do fundo
      <input type="color" id="corFundo" value="#ffffff">
    </label>
    <label>Tamanho
      <select id="tamanho">
        <option value="300">Normal (300 px)</option>
        <option value="800">Alta resolução (800 px)</option>
      </select>
    </label>
    <label>Logo no centro
      <input type="file" id="logoInput" accept="image/*">
      <button type="button" id="btnRemoverLogo" class="btn-clear">Remover logo</button>
    </label>
  </div>

  <button type="button" class="btn-main" id="btnGerar">Gerar QR Code</button>
  <p class="observacao">A biblioteca QRCode.js é carregada pela internet. Para usar totalmente offline, baixe a biblioteca e ajuste o caminho do script.</p>
  <div id="mensagem" role="status" aria-live="polite"></div>
  <div id="resultado"><canvas id="qr-canvas"></canvas></div>
  <button type="button" id="btnBaixar" class="btn-download">Baixar PNG</button>
</div>

<script>
(() => {
  'use strict';

  let abaAtual = 'texto';
  const canvas = document.getElementById('qr-canvas');
  const ctx = canvas.getContext('2d');
  const mensagem = document.getElementById('mensagem');
  const btnBaixar = document.getElementById('btnBaixar');
  const logoInput = document.getElementById('logoInput');
  const btnRemoverLogo = document.getElementById('btnRemoverLogo');

  document.querySelectorAll('.tab-btn').forEach(botao => {
    botao.addEventListener('click', () => mudarAba(botao.dataset.aba, botao));
  });
  document.getElementById('btnGerar').addEventListener('click', gerarQR);
  btnBaixar.addEventListener('click', baixarQR);
  logoInput.addEventListener('change', () => {
    btnRemoverLogo.style.display = logoInput.files.length ? 'inline-block' : 'none';
  });
  btnRemoverLogo.addEventListener('click', limparLogo);

  function mudarAba(aba, botao) {
    abaAtual = aba;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === botao));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'aba-' + aba));
    mensagem.textContent = '';
  }

  function limparLogo() {
    logoInput.value = '';
    btnRemoverLogo.style.display = 'none';
  }

  function escaparWifi(valor) {
    return valor.replace(/\\/g, '\\\\').replace(/;/g, '\\;')
      .replace(/,/g, '\\,').replace(/:/g, '\\:').replace(/"/g, '\\"');
  }

  function montarConteudo() {
    if (abaAtual === 'texto') {
      return document.getElementById('input-texto').value.trim();
    }
    if (abaAtual === 'wifi') {
      const ssid = document.getElementById('wifi-ssid').value;
      const senha = document.getElementById('wifi-senha').value;
      const tipo = document.getElementById('wifi-tipo').value;
      if (!ssid.trim()) return '';
      if (tipo !== 'nopass' && !senha) {
        mensagem.textContent = 'Digite a senha da rede Wi-Fi ou selecione “Sem senha”.';
        return '';
      }
      return `WIFI:T:${tipo};S:${escaparWifi(ssid)};P:${tipo === 'nopass' ? '' : escaparWifi(senha)};;`;
    }
    if (abaAtual === 'whats') {
      const num = document.getElementById('whats-num').value.replace(/\D/g, '');
      const msg = document.getElementById('whats-msg').value.trim();
      if (!num) return '';
      if (num.length < 8) {
        mensagem.textContent = 'Confira o número. Inclua o código do país e o DDD, sem sinal de + ou espaços.';
        return '';
      }
      return `https://wa.me/${num}${msg ? '?text=' + encodeURIComponent(msg) : ''}`;
    }
    return '';
  }

  function gerarQR() {
    mensagem.textContent = '';
    btnBaixar.style.display = 'none';
    canvas.style.display = 'none';

    if (typeof QRCode === 'undefined') {
      mensagem.textContent = 'A biblioteca QRCode.js não carregou. Verifique a conexão com a internet ou o caminho do arquivo da biblioteca.';
      return;
    }

    const conteudo = montarConteudo();
    if (!conteudo) {
      if (!mensagem.textContent) mensagem.textContent = 'Preencha os dados obrigatórios primeiro.';
      return;
    }

    const tamanho = Number(document.getElementById('tamanho').value);
    const corFrente = document.getElementById('corFrente').value;
    const corFundo = document.getElementById('corFundo').value;
    const tempDiv = document.createElement('div');

    try {
      new QRCode(tempDiv, {
        text: conteudo,
        width: tamanho,
        height: tamanho,
        colorDark: corFrente,
        colorLight: corFundo,
        correctLevel: QRCode.CorrectLevel.H
      });
    } catch (erro) {
      mensagem.textContent = 'Não foi possível gerar o QR Code. Confira o conteúdo informado.';
      console.error(erro);
      return;
    }

    // QRCode.js desenha o canvas de forma síncrona nos navegadores modernos.
    const qrCanvas = tempDiv.querySelector('canvas');
    const qrImg = tempDiv.querySelector('img');

    function finalizarComImagem(imagem) {
      canvas.width = tamanho;
      canvas.height = tamanho;
      ctx.fillStyle = corFundo;
      ctx.fillRect(0, 0, tamanho, tamanho);
      ctx.drawImage(imagem, 0, 0, tamanho, tamanho);

      if (!logoInput.files || !logoInput.files.length) {
        mostrarFinal();
        return;
      }

      const arquivo = logoInput.files[0];
      if (!arquivo.type.startsWith('image/')) {
        mensagem.textContent = 'Selecione um arquivo de imagem válido para o logotipo.';
        return;
      }

      const leitor = new FileReader();
      leitor.onerror = () => mensagem.textContent = 'Não foi possível ler o arquivo do logotipo.';
      leitor.onload = evento => {
        const logo = new Image();
        logo.onerror = () => mensagem.textContent = 'Não foi possível abrir o logotipo selecionado.';
        logo.onload = () => {
          const logoSize = tamanho * 0.20;
          const pos = (tamanho - logoSize) / 2;
          const margem = tamanho * 0.025;
          ctx.fillStyle = corFundo;
          ctx.fillRect(pos - margem, pos - margem, logoSize + margem * 2, logoSize + margem * 2);
          ctx.drawImage(logo, pos, pos, logoSize, logoSize);
          mostrarFinal();
        };
        logo.src = evento.target.result;
      };
      leitor.readAsDataURL(arquivo);
    }

    if (qrCanvas) {
      finalizarComImagem(qrCanvas);
    } else if (qrImg) {
      if (qrImg.complete && qrImg.naturalWidth) {
        finalizarComImagem(qrImg);
      } else {
        qrImg.onload = () => finalizarComImagem(qrImg);
        qrImg.onerror = () => mensagem.textContent = 'Falha ao desenhar o QR Code. Tente novamente.';
      }
    } else {
      mensagem.textContent = 'A biblioteca não retornou uma imagem QR Code. Verifique se a biblioteca carregou corretamente.';
    }
  }

  function mostrarFinal() {
    canvas.style.display = 'block';
    btnBaixar.style.display = 'block';
    mensagem.textContent = 'QR Code gerado. Teste a leitura antes de compartilhar ou imprimir.';
  }

  function baixarQR() {
    if (!canvas.width || canvas.style.display === 'none') {
      mensagem.textContent = 'Gere um QR Code antes de baixar.';
      return;
    }
    try {
      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = `qrcode-${abaAtual}.png`;
      document.body.appendChild(link);
      link.click();
      link.remove();
    } catch (erro) {
      mensagem.textContent = 'Não foi possível preparar o PNG para download.';
      console.error(erro);
    }
  }
})();
</script>
</body>
</html>
