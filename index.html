<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de QR Code</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1rem; }
    .container { background: white; padding: 1.5rem; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 440px; }
    h1 { font-size: 1.4rem; color: #1f2937; text-align: center; margin-top: 0; }
    .tabs { display: flex; gap: 6px; margin-bottom: 1rem; }
    .tab-btn { flex: 1; padding: 10px; background: #e5e7eb; color: #374151; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .tab-btn.active { background: #2563eb; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    input, select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; font-size: 0.85rem; color: #4b5563; }
    .options-grid label { display: flex; flex-direction: column; gap: 4px; }
    input[type="color"] { padding: 2px; height: 38px; cursor: pointer; }
    .btn-clear { background: #ef4444; color: white; border: none; border-radius: 6px; padding: 4px 8px; font-size: 0.75rem; cursor: pointer; margin-top: -6px; margin-bottom: 6px; display: none; }
    .btn-main, .btn-download { width: 100%; padding: 12px; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 5px; }
    .btn-main { background-color: #2563eb; }
    .btn-download { background-color: #16a34a; display: none; margin-top: 8px; }
    #resultado { display: flex; justify-content: center; margin: 1.5rem 0; }
    canvas { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid #e5e7eb; display: none; }
  </style>
</head>
<body>
  <div class="container">
  <h1>Gerador de QR Code</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="mudarAba('texto', this)">Link / Texto</button>
    <button class="tab-btn" onclick="mudarAba('wifi', this)">Wi-Fi</button>
    <button class="tab-btn" onclick="mudarAba('whats', this)">WhatsApp</button>
  </div>

  <div id="aba-texto" class="tab-content active">
    <input type="text" id="input-texto" placeholder="Cole seu link, texto ou código Pix...">
  </div>

  <div id="aba-wifi" class="tab-content">
    <input type="text" id="wifi-ssid" placeholder="Nome da rede Wi-Fi (SSID)">
    <input type="text" id="wifi-senha" placeholder="Senha do Wi-Fi">
    <select id="wifi-tipo">
      <option value="WPA">Segurança: WPA/WPA2 (Padrão)</option>
      <option value="WEP">Segurança: WEP</option>
      <option value="nopass">Sem senha</option>
    </select>
  </div>

  <div id="aba-whats" class="tab-content">
    <input type="text" id="whats-num" placeholder="Número com DDD (ex: 5519999999999)">
    <input type="text" id="whats-msg" placeholder="Mensagem automática (opcional)">
  </div>

  <div class="options-grid">
    <label>Cor do Código: <input type="color" id="corFrente" value="#000000"></label>
    <label>Cor do Fundo: <input type="color" id="corFundo" value="#ffffff"></label>
    <label>Tamanho:
      <select id="tamanho">
        <option value="300">Normal (300px)</option>
        <option value="800">Alta (800px - Impressão)</option>
      </select>
    </label>
    <label>Logo no centro:
      <input type="file" id="logoInput" accept="image/*" onchange="verificarLogo()" style="padding: 6px; font-size: 0.8rem;">
      <button type="button" id="btnRemoverLogo" class="btn-clear" onclick="limparLogo()">Remover logo</button>
    </label>
  </div>

  <button class="btn-main" id="btnGerar" onclick="gerarQR()">Gerar QR Code</button>
  <div id="resultado"><canvas id="qr-canvas"></canvas></div>
  <button id="btnBaixar" class="btn-download" onclick="baixarQR()">Baixar PNG</button>
  </div>
  <script>
  let abaAtual = 'texto';
  const canvas = document.getElementById('qr-canvas');

  function mudarAba(aba, botao) {
    abaAtual = aba;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    botao.classList.add('active');
    document.getElementById('aba-' + aba).classList.add('active');
  }

  function verificarLogo() {
    const logoInput = document.getElementById('logoInput');
    document.getElementById('btnRemoverLogo').style.display = logoInput.files.length > 0 ? 'inline-block' : 'none';
  }

  function limparLogo() {
    document.getElementById('logoInput').value = '';
    document.getElementById('btnRemoverLogo').style.display = 'none';
  }

  function montarConteudo() {
    if (abaAtual === 'texto') {
      return document.getElementById('input-texto').value.trim();
    }
    if (abaAtual === 'wifi') {
      const ssid = document.getElementById('wifi-ssid').value.trim();
      const senha = document.getElementById('wifi-senha').value.trim();
      const tipo = document.getElementById('wifi-tipo').value;
      if (!ssid) return '';
      return `WIFI:T:${tipo};S:${ssid};P:${senha};;`;
    }
    if (abaAtual === 'whats') {
      const num = document.getElementById('whats-num').value.replace(/\D/g, '');
      const msg = encodeURIComponent(document.getElementById('whats-msg').value.trim());
      if (!num) return '';
      return `https://wa.me{num}?text=${msg}`;
    }
  }
        function gerarQR() {
    const conteudo = montarConteudo();
    if (!conteudo) {
      alert('Preencha os dados obrigatórios primeiro!');
      return;
    }

    const btnGerar = document.getElementById('btnGerar');
    btnGerar.textContent = 'Gerando...';
    btnGerar.disabled = true;

    const tamanho = parseInt(document.getElementById('tamanho').value);
    const corFrente = document.getElementById('corFrente').value.replace('#', '');
    const corFundo = document.getElementById('corFundo').value;
    const corFundoHex = corFundo.replace('#', '');

    // API do QuickChart (super rápida e liberada em todas as redes)
    const urlApi = `https://quickchart.io{encodeURIComponent(conteudo)}&size=${tamanho}&dark=${corFrente}&light=${corFundoHex}&ecLevel=H&margin=2`;

    const resultadoDiv = document.getElementById('resultado');
    resultadoDiv.innerHTML = '';

    const img = new Image();
    img.style.maxWidth = '100%';
    img.style.borderRadius = '8px';
    img.style.border = '1px solid #e5e7eb';

    img.onload = function() {
      const logoInput = document.getElementById('logoInput');
      if (logoInput.files && logoInput.files.length > 0) {
        // Se tiver logo, desenha no canvas
        const tempImg = new Image();
        tempImg.crossOrigin = 'anonymous';
        tempImg.onload = function() {
          canvas.width = tamanho;
          canvas.height = tamanho;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(tempImg, 0, 0, tamanho, tamanho);

          const reader = new FileReader();
          reader.onload = function(e) {
            const logoImg = new Image();
            logoImg.onload = function() {
              const logoSize = tamanho * 0.22;
              const pos = (tamanho - logoSize) / 2;
              ctx.fillStyle = corFundo;
              ctx.fillRect(pos - 6, pos - 6, logoSize + 12, logoSize + 12);
              ctx.drawImage(logoImg, pos, pos, logoSize, logoSize);
              canvas.style.display = 'block';
              resultadoDiv.appendChild(canvas);
              finalizarExibicao(canvas.toDataURL('image/png'));
            };
            logoImg.src = e.target.result;
          };
          reader.readAsDataURL(logoInput.files.item(0));
        };
        tempImg.src = urlApi;
      } else {
        // Sem logo: exibe a imagem direto sem bloqueio de segurança
        resultadoDiv.appendChild(img);
        finalizarExibicao(urlApi);
      }
    };

    img.onerror = function() {
      alert('Falha ao conectar com o servidor de QR Code. Tente novamente.');
      btnGerar.textContent = 'Gerar QR Code';
      btnGerar.disabled = false;
    };

    img.src = urlApi;
  }

  let urlParaBaixar = '';

  function finalizarExibicao(url) {
    urlParaBaixar = url;
    document.getElementById('btnBaixar').style.display = 'block';
    const btnGerar = document.getElementById('btnGerar');
    btnGerar.textContent = 'Gerar QR Code';
    btnGerar.disabled = false;
  }

  async function baixarQR() {
    try {
      const resposta = await fetch(urlParaBaixar);
      const blob = await resposta.blob();
      const urlLocal = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = urlLocal;
      link.download = `qrcode-${abaAtual}.png`;
      link.click();
    } catch (e) {
      window.open(urlParaBaixar, '_blank');
    }
  }
</script>

</body>
</html>
